<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 매거진 큐레이션</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#faf9f6; --ink:#14130f; --sub:#55524a; --hint:#8f8b80; --line:#dedbd2; --pt:#e8451e; --serif:'Noto Serif KR', 'Nanum Myeongjo', serif; --thumb-radius:2px; --thumb-bg:#ebe8df; --thumb-fg:#bdb8a9; }
body { background:var(--bg); color:var(--ink); }
.hd { max-width:1160px; margin:0 auto; padding:0 24px; }
.hd__t { height:72px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:2px solid var(--ink); }
.hd__t nav { display:flex; gap:20px; font-size:14px; font-weight:600; }
.logo { font-family:var(--serif); font-weight:900; font-size:26px; letter-spacing:-.01em; }
.hd__r { justify-self:end; display:flex; gap:18px; font-size:14px; font-weight:600; }
.issue { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.500px; font-weight:600; color:var(--sub); letter-spacing:.02em; }
.wrap { max-width:1160px; margin:0 auto; padding:0 24px 120px; }
.eyebrow { font-size:12.500px; font-weight:800; color:var(--pt); letter-spacing:.06em; }
.hero { display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:44px; padding:40px 0 44px; align-items:center; border-bottom:1px solid var(--line); }
.hero h1 { margin:14px 0 16px; font-family:var(--serif); font-size:38px; line-height:1.34; letter-spacing:-.03em; font-weight:700; }
.hero p { font-size:16px; line-height:1.75; color:var(--sub); }
.hero .mt { margin-top:22px; padding-top:16px; border-top:1px solid var(--line); display:flex; gap:20px; font-size:13.500px; font-weight:600; flex-wrap:wrap; }
.hero .mt span b { color:var(--hint); font-weight:600; margin-right:6px; }
.rd { display:inline-block; margin-top:22px; font-size:15px; font-weight:700; border-bottom:2px solid var(--ink); padding-bottom:3px; }
.rank { display:grid; grid-template-columns:260px minmax(0,1fr); gap:44px; padding:44px 0; border-bottom:1px solid var(--line); }
.rank h2, .shelf h2 { font-family:var(--serif); font-size:26px; line-height:1.4; letter-spacing:-.025em; font-weight:700; }
.rank > div > p, .shelf__h p { margin-top:10px; font-size:14.500px; line-height:1.65; color:var(--sub); }
.rk { display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); transition:.15s; }
.rk:first-child { padding-top:0; } .rk:last-child { border-bottom:0; padding-bottom:0; }
.rk:hover { padding-left:8px; }
.rk i { font-family:var(--serif); font-style:normal; font-size:34px; font-weight:900; line-height:1; color:var(--pt); }
.rk strong { font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-.01em; }
.rk small { display:block; margin-top:4px; font-size:13px; color:var(--hint); }
.rk b { font-size:13.500px; font-weight:700; white-space:nowrap; }
.shelf { padding:44px 0 8px; }
.shelf__h { display:flex; align-items:flex-end; gap:24px; margin-bottom:22px; }
.shelf__h a { margin-left:auto; font-size:14px; font-weight:700; white-space:nowrap; }
.cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:28px 22px; }
.cd { display:block; }
.cd .k-thumb { transition:.2s; }
.cd:hover .k-thumb { opacity:.86; }
.cd .eyebrow { display:block; margin:14px 0 6px; font-size:11.500px; }
.cd strong { font-size:16.500px; line-height:1.45; font-weight:700; letter-spacing:-.015em; }
.cd p { margin-top:8px; font-size:13px; color:var(--hint); line-height:1.5; }
.nl { margin-top:56px; background:var(--ink); color:#fff; padding:40px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.nl h3 { font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:-.02em; }
.nl p { margin-top:6px; font-size:14.500px; color:rgba(255,255,255,.65); }
.nl a { margin-left:auto; padding:14px 26px; background:#fff; color:var(--ink); font-weight:800; font-size:15px; }
/* detail */
.art { max-width:780px; margin:0 auto; padding:52px 24px 0; text-align:center; }
.art h1 { margin:16px 0 18px; font-family:var(--serif); font-size:38px; line-height:1.36; letter-spacing:-.03em; font-weight:700; }
.art .by { font-size:14px; color:var(--sub); font-weight:500; }
.art .by b { color:var(--ink); font-weight:700; }
.cover { max-width:980px; margin:36px auto 0; padding:0 24px; }
.facts { max-width:780px; margin:36px auto 0; padding:0 24px; }
.facts ul { display:grid; grid-template-columns:repeat(3,1fr); border-top:2px solid var(--ink); border-bottom:1px solid var(--line); }
.facts li { padding:18px 20px; border-left:1px solid var(--line); }
.facts li:first-child { border-left:0; padding-left:0; }
.facts small { font-size:12px; font-weight:800; color:var(--pt); letter-spacing:.06em; }
.facts b { display:block; margin-top:6px; font-size:16px; line-height:1.5; font-weight:700; }
.txt { max-width:780px; margin:0 auto; padding:40px 24px 160px; }
.txt .k-prose { font-size:17px; line-height:1.85; --prose-accent:#e8451e; --prose-border:#dedbd2; --prose-th:#f1efe8; }
.float { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:20; width:min(720px, calc(100% - 32px)); display:flex; align-items:center; gap:14px; padding:12px 12px 12px 22px; background:var(--ink); color:#fff; box-shadow:0 12px 32px rgba(20,19,15,.28); }
.float p { flex:1; min-width:0; font-size:14.500px; font-weight:600; }
.float p small { display:block; font-size:12px; color:rgba(255,255,255,.6); font-weight:500; margin-bottom:1px; }
.float button { width:44px; height:44px; display:grid; place-items:center; color:rgba(255,255,255,.8); }
.float a { padding:13px 24px; background:var(--pt); font-size:15px; font-weight:800; white-space:nowrap; }
@media (max-width: 860px) {
  .hd__t { grid-template-columns:auto 1fr; height:60px; } .hd__t nav { display:none; } .logo { font-size:22px; }
  .hero { grid-template-columns:1fr; gap:22px; padding:24px 0 32px; } .hero h1 { font-size:27px; }
  .rank { grid-template-columns:1fr; gap:22px; padding:32px 0; }
  .rank h2, .shelf h2 { font-size:22px; }
  .rk { grid-template-columns:40px minmax(0,1fr); } .rk b { grid-column:2; } .rk i { font-size:26px; }
  .shelf__h { display:block; } .shelf__h a { display:none; }
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 14px; }
  .nl { padding:28px 22px; } .nl a { margin:0; width:100%; text-align:center; }
  .art { padding-top:32px; } .art h1 { font-size:27px; }
  .facts ul { grid-template-columns:1fr; } .facts li { border-left:0; border-top:1px solid var(--line); padding:14px 0; } .facts li:first-child { border-top:0; }
  .float { bottom:12px; padding-left:16px; } .float button { display:none; } .float a { padding:13px 18px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script>
const { esc, ic } = K;
const header = () => `
<header class="hd">
  <div class="hd__t"><nav><a href="#main">이번 주</a><a href="#main">전체 행사</a><a href="#main">캘린더</a></nav><a class="logo" href="#main">DEV.EVENT</a><div class="hd__r"><a href="#main" data-toast="행사 등록 요청 화면으로 이동해요">행사 등록 요청</a><a href="#main">로그인</a></div></div>
  <div class="issue"><span>2026년 11월 2주차</span><span>매주 일요일 저녁 8시 발행 · 접수 중 ${K.ALL.length}건</span></div>
</header>`;

const card = (e) => `
<a class="cd" href="${e.href}">${K.thumb(e)}
  <span class="eyebrow">${e.kind} · ${e.topics[0] || ''}</span>
  <strong class="clamp2">${esc(e.title)}</strong>
  <p>${esc(e.organizer)}<br>${e.when} · ${e.cost}</p>
</a>`;
const shelf = (title, desc, items) => items.length ? `
<section class="shelf"><div class="shelf__h"><div><h2>${title}</h2><p>${desc}</p></div><a href="#main" data-toast="이 주제의 행사를 모두 보여줘요">모두 보기 →</a></div><div class="cards">${items.slice(0, 4).map(card).join('')}</div></section>` : '';

function main() {
  const f = K.featured;
  const top = K.ALL.filter((e) => e.recruit && e.id !== f.id).slice(0, 5);
  const used = new Set([f.id, ...top.map((e) => e.id)]);
  const pick = (fn) => K.ALL.filter((e) => !used.has(e.id) && fn(e));
  return header() + `
<div class="wrap">
  <section class="hero">
    <a href="${f.href}">${K.thumb(f)}</a>
    <div><span class="eyebrow">이번 주 단 하나</span><h1>${esc(f.title)}</h1><p class="clamp3">${esc(f.excerpt)}</p>
      <div class="mt"><span><b>주최</b>${esc(f.organizer)}</span><span><b>${f.timeLabel}</b>${f.when}</span><span><b>참가비</b>${f.cost}</span></div>
      <a class="rd" href="${f.href}">자세히 읽기 →</a></div>
  </section>
  <section class="rank">
    <div><span class="eyebrow">마감 임박</span><h2>이번 주에 문 닫는<br>다섯 가지</h2><p>고민할 시간이 얼마 남지 않은 행사부터 순서대로 골랐어요.</p></div>
    <div>${top.map((e, i) => `<a class="rk" href="${e.href}"><i>${K.pad(i + 1)}</i><div><strong class="clamp1">${esc(e.title)}</strong><small>${esc(e.organizer)} · ${e.mode.join('·')} · ${e.cost}</small></div><b>${e.days <= 0 ? '오늘 ' + e.keyTime : K.fdw(e.keyDate)} 마감</b></a>`).join('')}</div>
  </section>
  ${shelf('퇴근길에 들르는 오프라인 밋업', '평일 저녁, 회사에서 멀지 않은 곳에서 열리는 모임이에요.', pick((e) => e.mode.includes('오프라인') && e.kind === '모임'))}
  ${shelf('집에서 듣는 무료 웨비나', '이동 없이, 비용 없이. 점심시간이나 저녁에 틀어 두기 좋아요.', pick((e) => e.mode.includes('온라인') && e.cost === '무료' && e.kind === '세미나'))}
  ${shelf('주말을 통째로 쓰는 해커톤·대회', '결과물이 남는 주말. 팀 모집 마감부터 확인하세요.', pick((e) => e.kind === '대회'))}
  <section class="nl"><div><h3>일요일 저녁 8시, 한 주의 행사를 편지로</h3><p>에디터가 고른 행사와 마감 임박 소식을 메일로 보내드려요.</p></div><a href="#main" data-toast="뉴스레터 구독 화면으로 이동해요">무료 구독하기</a></section>
</div>`;
}

function detail(e) {
  return header() + `
<article>
  <div class="art"><span class="eyebrow">${e.kind} · ${e.topics.join(' · ')}</span><h1>${esc(e.title)}</h1><p class="by">주최 <b>${esc(e.organizer)}</b> &nbsp;·&nbsp; ${K.fd(new Date(e.created))} 등록</p></div>
  <div class="cover">${K.thumb(e)}</div>
  <div class="facts"><ul>
    <li><small>${e.recruit ? '접수 마감' : '언제'}</small><b>${e.recruit ? `${K.fdw(e.en)} ${K.ft(e.en)}` : e.range}</b></li>
    <li><small>어디서</small><b>${e.mode.join(' · ')}</b></li>
    <li><small>참가비</small><b>${e.cost}</b></li>
  </ul></div>
  <div class="txt"><div class="k-prose">${e.descHtml}</div></div>
</article>
<div class="float"><p><small>${e.recruit ? '접수 마감까지 ' + e.remain : e.label}</small><span class="clamp1">${e.when} · ${e.cost}</span></p><button data-toast="관심 행사에 담았어요">${ic('bookmark')}</button><button data-toast="캘린더에 추가했어요">${ic('calendar')}</button><button data-toast="링크가 복사되었어요">${ic('share')}</button><a href="${esc(e.link)}" target="_blank" rel="noopener">신청하러 가기</a></div>`;
}
K.mount({ main, detail });
</script>
</body>
</html>

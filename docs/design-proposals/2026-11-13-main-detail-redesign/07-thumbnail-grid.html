<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 썸네일 그리드</title>
<link rel="stylesheet" href="shared/base.css">
<style>
:root { --ink:#0f1114; --sub:#4d525b; --hint:#878c96; --line:#e7e9ee; --soft:#f3f4f7; --blue:#0043ff; --red:#f03e3e; --thumb-radius:14px; }
body { background:#fff; color:var(--ink); }
.hd { position:sticky; top:0; z-index:20; background:#fff; }
.hd__in { max-width:1360px; margin:0 auto; height:60px; padding:0 24px; display:flex; align-items:center; gap:20px; }
.logo { font-weight:800; font-size:19px; }
.logo i { display:inline-block; width:9px; height:9px; margin:0 1px; border-radius:50%; background:var(--blue); }
.q { flex:1; max-width:520px; margin:0 auto; display:flex; align-items:center; height:42px; border:1px solid var(--line); border-radius:999px; padding:0 6px 0 18px; font-size:14.500px; color:var(--hint); }
.q b { margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--soft); display:grid; place-items:center; color:var(--sub); }
.hd__r { display:flex; gap:8px; font-size:14px; font-weight:600; }
.hd__r button { height:38px; padding:0 14px; border-radius:999px; background:var(--soft); display:flex; align-items:center; gap:6px; }
.cats { max-width:1360px; margin:0 auto; padding:6px 24px 12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
.chip { flex:none; padding:8px 14px; border-radius:10px; background:var(--soft); font-size:14px; font-weight:600; }
.chip.is-on { background:var(--ink); color:#fff; }
.sep { flex:none; width:1px; margin:6px 4px; background:var(--line); }
.wrap { max-width:1360px; margin:0 auto; padding:12px 24px 100px; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:36px 18px; }
.cd { display:block; }
.cd__i { position:relative; }
.cd__i .k-thumb { transition:border-radius .2s; }
.cd:hover .k-thumb { border-radius:0; }
.dd { position:absolute; right:8px; bottom:8px; padding:4px 8px; border-radius:6px; background:rgba(15,17,20,.84); color:#fff; font-size:12px; font-weight:700; }
.dd.is-hot { background:var(--red); }
.nw { position:absolute; left:8px; top:8px; padding:4px 8px; border-radius:6px; background:var(--blue); color:#fff; font-size:11px; font-weight:800; }
.bm { position:absolute; right:8px; top:8px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.94); display:grid; place-items:center; opacity:0; transition:.15s; }
.cd:hover .bm { opacity:1; }
.cd__b { display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; margin-top:12px; }
.av { width:36px; height:36px; border-radius:50%; background:var(--soft); display:grid; place-items:center; font-weight:800; font-size:15px; color:var(--sub); }
.cd strong { font-size:16px; line-height:1.4; font-weight:700; letter-spacing:-.01em; }
.cd p { margin-top:5px; font-size:13.500px; color:var(--hint); line-height:1.5; }
.cd p b { font-weight:500; color:var(--sub); }
/* detail */
.dw { max-width:1280px; margin:0 auto; padding:16px 24px 100px; display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:28px; align-items:start; }
.dw .k-thumb.big { --thumb-radius:16px; }
.dw h1 { margin-top:18px; font-size:24px; line-height:1.38; font-weight:800; letter-spacing:-.02em; }
.ow { display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap; }
.ow .av { width:42px; height:42px; }
.ow p b { display:block; font-size:15.500px; font-weight:700; }
.ow p small { font-size:12.500px; color:var(--hint); }
.pl { height:40px; padding:0 16px; border-radius:999px; background:var(--soft); font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; }
.pl.is-pri { background:var(--blue); color:#fff; margin-left:auto; padding:0 22px; }
.desc { margin-top:16px; padding:18px 20px; border-radius:16px; background:var(--soft); }
.desc__m { display:flex; gap:12px; flex-wrap:wrap; font-size:14px; font-weight:700; margin-bottom:14px; }
.desc__m span { color:var(--red); }
.desc .k-prose { font-size:15px; --prose-th:#e9ebf0; }
.nx h3 { font-size:16px; font-weight:800; margin-bottom:12px; }
.nx a { display:grid; grid-template-columns:168px minmax(0,1fr); gap:10px; padding:5px 0; }
.nx .k-thumb { --thumb-radius:10px; }
.nx strong { font-size:14px; line-height:1.4; font-weight:700; }
.nx small { display:block; margin-top:4px; font-size:12.500px; color:var(--hint); line-height:1.5; }
@media (max-width: 1100px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width: 820px) {
  .hd__in { padding:0 16px; gap:10px; } .q { display:none; } .hd__r { margin-left:auto; } .hd__r button:first-child { display:none; }
  .cats, .wrap { padding-left:16px; padding-right:16px; }
  .grid { grid-template-columns:1fr; gap:26px; }
  .dw { grid-template-columns:1fr; padding:0 0 100px; }
  .dw .k-thumb.big { --thumb-radius:0; }
  .dw > div { padding:0 16px; } .dw > div:first-child { padding:0; } .dw > div:first-child > *:not(.big) { margin-left:16px; margin-right:16px; }
  .dw h1 { font-size:20px; }
  .pl.is-pri { order:5; width:100%; margin:4px 0 0; justify-content:center; height:48px; }
  .nx a { grid-template-columns:140px minmax(0,1fr); }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script>
const { esc, ic } = K;
const header = () => `
<header class="hd"><div class="hd__in">
  <a class="logo" href="#main">DEV<i></i>EVENT</a>
  <div class="q">행사, 주최, 기술 키워드 검색<b>${ic('search', 18)}</b></div>
  <div class="hd__r"><button data-toast="행사 등록 요청 화면으로 이동해요">${ic('plus', 16)} 행사 등록 요청</button><button>${ic('user', 16)} 로그인</button></div>
</div></header>`;

const card = (e) => `
<a class="cd" href="${e.href}">
  <div class="cd__i">${K.thumb(e)}${e.isNew ? '<span class="nw">NEW</span>' : ''}<span class="bm">${ic('bookmark', 18)}</span><span class="dd${e.urgent ? ' is-hot' : ''}">${e.label}</span></div>
  <div class="cd__b"><span class="av">${esc(e.initial)}</span><div><strong class="clamp2">${esc(e.title)}</strong><p><b>${esc(e.organizer)}</b><br>${e.mode.join('·')} · ${e.cost} · ${e.recruit ? K.fdw(e.en) + ' 마감' : K.fdw(e.keyDate) + ' ' + e.keyTime}</p></div></div>
</a>`;

function main() {
  const L = K.list();
  return header() + `
<div class="cats">${K.chips('topic', K.TOPIC)}<i class="sep"></i>${K.KIND.map((v) => `<button class="chip${K.on('kind', v)}" data-set="kind:${K.state.kind === v ? '전체' : v}">${v}</button>`).join('')}<i class="sep"></i>${['온라인', '오프라인'].map((v) => `<button class="chip${K.on('mode', v)}" data-set="mode:${K.state.mode === v ? '전체' : v}">${v}</button>`).join('')}<button class="chip${K.on('cost', '무료')}" data-set="cost:${K.state.cost === '무료' ? '전체' : '무료'}">무료</button></div>
<div class="wrap"><div class="grid">${L.map(card).join('')}</div></div>`;
}

function detail(e) {
  return header() + `
<div class="dw">
  <div>
    ${K.thumb(e, 'big')}
    <h1>${esc(e.title)}</h1>
    <div class="ow"><span class="av">${esc(e.initial)}</span><p><b>${esc(e.organizer)}</b><small>주최</small></p>
      <button class="pl" data-toast="관심 행사에 담았어요">${ic('bookmark', 17)} 관심</button><button class="pl" data-toast="캘린더에 추가했어요">${ic('calendar', 17)} 캘린더</button><button class="pl" data-toast="링크가 복사되었어요">${ic('share', 17)} 공유</button>
      <a class="pl is-pri" href="${esc(e.link)}" target="_blank" rel="noopener">신청하러 가기 ${ic('out', 17)}</a></div>
    <div class="desc"><div class="desc__m"><span>${e.label}</span>${e.when} · ${e.mode.join('·')} · ${e.cost} · ${e.kind}</div><div class="k-prose">${e.descHtml}</div></div>
  </div>
  <aside class="nx"><h3>이어서 볼 행사</h3>${K.related(e, 8).map((x) => `<a href="${x.href}">${K.thumb(x)}<div><strong class="clamp2">${esc(x.title)}</strong><small>${esc(x.organizer)}<br>${x.label} · ${x.cost}</small></div></a>`).join('')}</aside>
</div>`;
}
K.mount({ main, detail });
</script>
</body>
</html>

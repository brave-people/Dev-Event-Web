    <div class="rule"><div><b>행사를 누르면 상세 화면으로</b><p>타임라인의 행사 카드를 그대로 씁니다. 세 칸일 때는 목록이 글자뿐이었는데, 두 칸이 되어 남는 폭에 썸네일(264px)을 넣었습니다. 상세에서 돌아오면 캘린더와 고른 날짜가 그대로입니다.</p></div></div>
    <div class="rule"><div><b>그날의 행사를 두 묶음으로</b><p>"이날 접수를 마감해요"와 "이날 열려요"로 나눕니다. 지난 날짜를 누르면 "마감했어요", "열렸어요"로 바뀌고 끝난 행사가 흐리게 보입니다.</p><small>참고: 시안 08 그대로</small></div></div>
    <div class="rule"><div><b>오늘과 고른 날</b><p>오늘은 날짜 숫자를 검정 알약으로 채우고, 고른 날은 칸 둘레에 검정 테두리를 둡니다. 다른 날을 골라도 오늘 표시는 남습니다. 타임라인의 날짜 띠와 같은 약속입니다.</p><small>참고: Luma(오늘과 고른 날을 다른 방식으로 표시)</small></div></div>

    <div class="rule"><div><b>모바일</b><p>달력 한 달이 위, 그날 목록이 아래입니다. 보기 전환은 글자 대신 아이콘 두 개로 줄였습니다. 날짜 띠는 캘린더에서는 보이지 않습니다.</p><small>참고: 시안 08의 모바일 구성</small></div></div>

  <div class="note"><b>지금 서비스와의 차이, 구현할 때 챙길 것.</b><br>

document.getElementById('emcards').innerHTML = (R.empties || []).map((b) => `<div class="card nrow${b.pick ? ' is-pick' : ''}"><div><h4>${b.name}${pickTag(b)}</h4><p>${b.desc}</p><p class="ref">참고: ${b.ref}</p>${pros(b)}<a class="x open" href="app.html?banner=${b.id}" target="_blank" rel="noopener">목업에서 보기 ↗</a></div>${crop(`app.html?banner=${b.id}&x=22`, 1280, 400)}</div>`).join('');
document.getElementById('bn2cards').innerHTML = BN2.map((b) => `<div class="card nrow${b.pick ? ' is-pick' : ''}"><div><h4>${b.name}${pickTag(b)}</h4><p>${b.desc}</p><p class="ref">참고: ${b.ref}</p><dl><dt>높이</dt><dd>${b.h}</dd><dt>첫 화면 행사</dt><dd>${b.n}</dd></dl>${pros(b)}<a class="x open" href="app.html?banner=${b.id}" target="_blank" rel="noopener">목업에서 보기 ↗</a></div>${crop(`app.html?banner=${b.id}&x=8`, 1280, b.ch || 480)}</div>`).join('');
document.getElementById('bncards').innerHTML = BN.map((b) => `<div class="card${b.pick ? ' is-pick' : ''}"><h4>${b.name}${pickTag(b)}</h4><p>${b.desc}</p>${crop(`app.html?banner=${b.id}&x=7`, 1280, 500)}${pros(b)}<a class="x open" href="app.html?banner=${b.id}" target="_blank" rel="noopener">목업에서 보기 ↗</a></div>`).join('');
document.getElementById('bntable').innerHTML = `<thead><tr><th>안</th><th>높이<br>PC / 모바일</th><th>첫 화면 행사 수<br>PC / 모바일</th><th>누가 챙겨야 하나</th><th>한 줄 평</th></tr></thead><tbody><tr><td>지금</td><td class="n">448 / 352px</td><td class="n">0 / 0건</td><td>없음</td><td>첫 화면이 배너와 안내로 다 찹니다.</td></tr>${[...BN, ...BN2].map((b) => `<tr class="${b.pick ? 'is-pick' : ''}"><td>${b.name} ${pickTag(b)}</td><td class="n">${b.h}</td><td class="n">${b.n}</td><td>${b.ops}</td><td>${b.one}</td></tr>`).join('')}</tbody>`;

const WT = { same: '<span class="tag s">셋이 같은 무게</span>', near: '<span class="tag t">메일이 조금 앞</span>', mail: '<span class="tag g">메일 우선</span>' }, WO = { same: 0, near: 1, mail: 2 };

// 참고 서비스 모음
const PART = { card: '카드', detail: '상세', date: '날짜 이동', thumb: '썸네일', new: 'NEW 표시', banner: '배너', sub: '소식 받기·푸터' };
document.getElementById('allrefs').innerHTML = Object.keys(PART).flatMap((k) => (R[k] || []).map((r) => `<tr><td>${PART[k]}</td><td>${r.url ? `<a class="x" href="${r.url}" target="_blank" rel="noopener">${r.svc}</a>` : r.svc}</td><td>${r.took}</td><td>${lv[r.lv] || ''}</td></tr>`)).join('');
document.getElementById('notseen').innerHTML = R.notSeen ? `<b>확인하지 못한 곳.</b> ${R.notSeen}` : '';

// 미리보기 동작
function paintViewer(v) {
  const st = v.querySelector('.vw__st'), fr = v.querySelector('iframe'), dev = v.dataset.dev, theme = v.dataset.theme;
  const [path, hash] = v.dataset.src.split('#');
  const url = `${path}&theme=${theme}${v.dataset.st || ''}${hash ? '#' + hash : ''}`;
  if (fr.dataset.url !== url) { fr.dataset.url = url; fr.dataset.lazy = url; if (fr.dataset.vis === '1') fr.src = url; }
  v.querySelector('.vw__bar a').href = url;
  v.querySelectorAll('.seg').forEach((s) => s.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', b.dataset.v === v.dataset[s.dataset.k])));
  const h = Number(v.dataset.h);
  if (dev === 'mo') { st.classList.add('is-mo'); st.style.height = ''; fr.style.width = '390px'; fr.style.height = '760px'; fr.style.transform = 'none'; }
  else { st.classList.remove('is-mo'); const s = st.clientWidth / 1280; st.style.height = h * s + 'px'; fr.style.width = '1280px'; fr.style.height = h + 'px'; fr.style.transform = `scale(${s})`; }
}
function paintCrops() { document.querySelectorAll('.crop').forEach((c) => { const w = Number(c.dataset.w), h = Number(c.dataset.h), s = c.clientWidth / w, fr = c.querySelector('iframe'); c.style.height = h * s + 'px'; fr.style.width = w + 'px'; fr.style.height = h + 'px'; fr.style.transform = `scale(${s})`; }); }
function paintAll() { document.querySelectorAll('.vw').forEach(paintViewer); paintCrops(); }
// 미리보기 창은 화면 가까이 왔을 때만 불러오고, 멀어지면 비운다. 창이 백 개가 넘어 한꺼번에 불러오면 브라우저가 자원 부족 오류를 낸다(2026-11-17)
const ioNear = new IntersectionObserver((es) => es.forEach((e) => { const fr = e.target; if (!e.isIntersecting) return; fr.dataset.vis = '1'; if (fr.dataset.lazy && fr.getAttribute('src') !== fr.dataset.lazy) fr.src = fr.dataset.lazy; }), { rootMargin: '500px 0px' });
const ioFar = new IntersectionObserver((es) => es.forEach((e) => { const fr = e.target; if (e.isIntersecting || fr.dataset.vis !== '1') return; fr.dataset.vis = ''; fr.removeAttribute('src'); try { fr.contentWindow.location.replace('about:blank'); } catch (err) { /* 이미 비어 있음 */ } }), { rootMargin: '2600px 0px' });
function lazyFrames() { document.querySelectorAll('.crop iframe, .vw iframe').forEach((fr) => { if (fr.dataset.io) return; fr.dataset.io = '1'; ioNear.observe(fr); ioFar.observe(fr); }); }
document.addEventListener('click', (e) => { const b = e.target.closest('.seg button'); if (!b) return; const v = b.closest('.vw'); v.dataset[b.parentElement.dataset.k] = b.dataset.v; paintViewer(v); });
function pickTab(v, b) { v.dataset.src = b.dataset.src; v.querySelectorAll('.vw__tabs button').forEach((x) => x.classList.toggle('is-on', x === b)); v.querySelector('.vw__cap').innerHTML = b.dataset.cap; paintViewer(v); }
document.addEventListener('click', (e) => { const b = e.target.closest('.vw__tabs button'); if (b) pickTab(b.closest('.vw'), b); });
document.addEventListener('keydown', (e) => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; const v = e.target.closest && e.target.closest('.vw-pick'); if (!v) return;
  const bs = [...v.querySelectorAll('.vw__tabs button')], i = bs.findIndex((x) => x.classList.contains('is-on')), n = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length]; e.preventDefault(); pickTab(v, n); n.focus(); });
window.addEventListener('resize', paintAll); paintAll(); lazyFrames();
// 목차 현재 위치
const links = [...document.querySelectorAll('#toc a')];
const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle('is-on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-20% 0px -70% 0px' });
document.querySelectorAll('section').forEach((s) => io.observe(s));
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 개발자 에디터</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0d1117; --panel:#010409; --line:#21262d; --ink:#e6edf3; --sub:#9da7b3; --hint:#6e7681; --orange:#ffa657; --green:#7ee787; --blue:#79c0ff; --red:#ff7b72; --purple:#d2a8ff; --yellow:#e3b341; --sel:#161b22; --mono:'JetBrains Mono', 'Pretendard Variable', ui-monospace, Menlo, monospace; --thumb-bg:#161b22; --thumb-fg:#30363d; --thumb-radius:8px; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13.500px; }
#app { height:100%; display:grid; grid-template-rows:38px minmax(0,1fr) 26px; }
.tt { display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12.500px; color:var(--sub); }
.tt b { color:var(--ink); font-weight:700; letter-spacing:.02em; }
.tt .cmd { flex:1; max-width:440px; margin:0 auto; height:24px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--hint); }
.tt a { color:var(--sub); }
.ws { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:0; }
.ex { overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:10px 0 30px; }
.ex h3 { padding:10px 16px 6px; font-size:11px; font-weight:700; color:var(--hint); letter-spacing:.08em; }
.ex h4 { padding:6px 16px 4px; font-size:12.500px; font-weight:700; color:var(--ink); }
.ex h4::before { content:'▾ '; color:var(--hint); }
.fo { width:100%; display:flex; gap:8px; padding:4px 16px 4px 32px; text-align:left; color:var(--sub); font-size:13px; }
.fo:hover { background:var(--sel); color:var(--ink); }
.fo.is-on { background:#1f6feb26; color:var(--blue); box-shadow:inset 2px 0 0 var(--blue); }
.fo span { margin-left:auto; color:var(--hint); font-size:12px; }
.ed { min-height:0; display:grid; grid-template-rows:36px 30px minmax(0,1fr); }
.tabs { display:flex; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.tabs a { flex:none; display:flex; align-items:center; gap:8px; padding:0 16px; border-right:1px solid var(--line); color:var(--hint); font-size:12.500px; }
.tabs a.is-on { background:var(--bg); color:var(--ink); box-shadow:inset 0 2px 0 var(--orange); }
.tabs a i { font-style:normal; color:var(--blue); }
.bc { display:flex; align-items:center; gap:8px; padding:0 18px; font-size:12px; color:var(--hint); border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
.bc b { color:var(--sub); font-weight:500; }
.code { overflow-y:auto; padding:10px 0 60px; counter-reset:ln; }
.ln, .cm { display:grid; grid-template-columns:52px 108px 62px minmax(0,1fr); align-items:baseline; gap:0 14px; padding:0 18px 0 0; min-height:34px; line-height:34px; counter-increment:ln; }
.ln::before, .cm::before { content:counter(ln); text-align:right; color:#484f58; font-size:12px; }
.ln:hover { background:var(--sel); }
.cm { color:var(--hint); grid-template-columns:52px minmax(0,1fr); margin-top:8px; }
.cm b { color:var(--green); font-weight:500; }
.t-d { color:var(--orange); white-space:nowrap; }
.t-s { font-size:11.500px; font-weight:700; white-space:nowrap; }
.s-dead { color:var(--red); } .s-open { color:var(--blue); } .s-now { color:var(--yellow); }
.t-m { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t-m b { font-weight:700; font-family:'Pretendard Variable', sans-serif; font-size:14.500px; letter-spacing:-.005em; }
.t-m i { font-style:normal; color:var(--hint); margin-left:12px; }
.t-m u { text-decoration:none; color:var(--green); margin-left:10px; font-size:12.500px; }
.t-m u.is-paid { color:var(--purple); }
.sb { display:flex; align-items:center; gap:16px; padding:0 12px; background:#1158c7; color:#fff; font-size:11.500px; white-space:nowrap; overflow:hidden; }
.sb span:last-child { margin-left:auto; }
/* detail */
.pv { overflow-y:auto; padding:22px 0 80px; }
.pv__in { max-width:820px; margin:0 auto; padding:0 28px; }
.fm { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:14px 0; counter-reset:fl; }
.fm p { display:grid; grid-template-columns:44px 84px minmax(0,1fr); gap:12px; line-height:26px; counter-increment:fl; }
.fm p::before { content:counter(fl); text-align:right; color:#484f58; font-size:12px; }
.fm p.dash { color:var(--hint); grid-template-columns:44px 1fr; }
.fm .k { color:var(--green); } .fm .v { color:var(--blue); min-width:0; } .fm .v.is-s { color:var(--orange); } .fm .v.is-r { color:var(--red); }
.run { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 26px; }
.run a, .run button { height:36px; padding:0 14px; border-radius:6px; border:1px solid var(--line); background:var(--sel); color:var(--ink); font-size:12.500px; display:flex; align-items:center; gap:6px; }
.run a { background:#238636; border-color:#2ea043; color:#fff; font-weight:700; padding:0 18px; }
.pv h1 { font-family:'Pretendard Variable', sans-serif; font-size:27px; line-height:1.36; font-weight:800; letter-spacing:-.02em; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:22px; }
.pv .k-thumb { margin-bottom:22px; border:1px solid var(--line); }
.pv .k-prose { font-family:'Pretendard Variable', sans-serif; --prose-fg:#c9d1d9; --prose-head:#e6edf3; --prose-border:#30363d; --prose-th:#161b22; --prose-accent:#79c0ff; --prose-muted:#8b949e; }
@media (max-width: 860px) {
  .tt .cmd, .tt a { display:none; }
  .ws { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
  .ex { display:flex; gap:6px; overflow-x:auto; padding:8px 10px; border-right:0; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .ex h3, .ex h4 { display:none; }
  .fo { flex:none; width:auto; padding:4px 10px; border:1px solid var(--line); border-radius:6px; }
  .fo.is-on { box-shadow:none; border-color:var(--blue); }
  .ln { grid-template-columns:30px auto auto minmax(0,1fr); gap:0 8px; line-height:1.5; padding:9px 12px 9px 0; }
  .ln::before { grid-row:1 / 3; line-height:1.7; }
  .t-m { grid-column:2 / -1; white-space:normal; }
  .t-m i { display:block; margin:2px 0 0; } .t-m u { display:block; margin:2px 0 0; }
  .cm { grid-template-columns:30px minmax(0,1fr); }
  .sb span:nth-child(n+3):not(:last-child) { display:none; }
  .pv__in { padding:0 14px; } .pv h1 { font-size:21px; }
  .fm p { grid-template-columns:28px 64px minmax(0,1fr); gap:8px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script>
const { esc, ic } = K;
const titlebar = () => `<div class="tt"><b>DEV.EVENT</b><div class="cmd">${ic('search', 13)} 행사 검색 &nbsp;⌘K</div><a href="#main" data-toast="행사 등록 요청 화면으로 이동해요">+ 행사 등록 요청</a><a href="#main">로그인</a></div>`;
const fo = (k, v, n) => `<button class="fo${K.on(k, v)}" data-set="${k}:${v}">${v}<span>${n}</span></button>`;
const c = (fn) => K.count(fn);
const explorer = () => `
<aside class="ex"><h3>탐색기</h3>
  <h4>분야</h4>${fo('topic', '전체', K.ALL.length)}${K.TOPIC.map((t) => fo('topic', t, c((e) => e.topics.includes(t)))).join('')}
  <h4>유형</h4>${fo('kind', '전체', K.ALL.length)}${K.KIND.map((t) => fo('kind', t, c((e) => e.kind === t))).join('')}
  <h4>방식</h4>${fo('mode', '전체', K.ALL.length)}${K.MODE.map((t) => fo('mode', t, c((e) => e.mode.includes(t)))).join('')}
  <h4>참가비</h4>${fo('cost', '전체', K.ALL.length)}${K.COST.map((t) => fo('cost', t, c((e) => e.cost === t))).join('')}
</aside>`;
const status = () => `<div class="sb"><span>⎇ 접수중</span><span>✓ 전체 ${K.ALL.length}건</span><span>⚠ 오늘 마감 ${c((e) => e.recruit && e.days <= 0)}건</span><span>↻ 5분 전 동기화</span><span>${K.todayText} · KST</span></div>`;

const line = (e) => `
<a class="ln" href="${e.href}">
  <span class="t-d">${K.pad(e.keyDate.getMonth() + 1)}.${K.pad(e.keyDate.getDate())} ${K.DOW[e.keyDate.getDay()]} ${e.keyTime}</span>
  <span class="t-s ${e.state === '진행 중' ? 's-now' : e.recruit ? 's-dead' : 's-open'}">${e.state === '진행 중' ? '[진행]' : e.recruit ? '[마감]' : '[행사]'}</span>
  <span class="t-m"><b>${esc(e.title)}</b><u class="${e.cost === '유료' ? 'is-paid' : ''}">#${e.mode.join(' #')} #${e.cost}</u><i>// ${esc(e.organizer)}</i></span>
</a>`;

function main() {
  const L = K.list();
  const groups = K.groupByDay(L);
  return titlebar() + `
<div class="ws">${explorer()}
  <div class="ed">
    <div class="tabs"><a class="is-on" href="#main"><i>M↓</i> 행사.md</a><a href="#main"><i>M↓</i> 캘린더.md</a><a href="#main"><i>M↓</i> 관심행사.md</a></div>
    <div class="bc">dev-event <b>›</b> 접수중 <b>›</b> ${K.state.topic === '전체' ? '모든 분야' : K.state.topic} <b>›</b> 마감 빠른 순 · ${L.length}건</div>
    <div class="code">${groups.map((g) => { const i = K.dayInfo(g.date); return `<p class="cm"><span># ── <b>${i.rel ? i.rel + ' · ' : ''}${i.m}월 ${i.d}일 ${i.dow}요일</b> ── ${g.items.length}건</span></p>${g.items.map(line).join('')}`; }).join('') || '<p class="cm"><span># 조건에 맞는 행사가 없어요</span></p>'}</div>
  </div>
</div>${status()}`;
}

function detail(e) {
  return titlebar() + `
<div class="ws">${explorer()}
  <div class="ed">
    <div class="tabs"><a href="#main"><i>M↓</i> 행사.md</a><a class="is-on" href="${e.href}"><i>M↓</i> ${e.id}.md ✕</a></div>
    <div class="bc">dev-event <b>›</b> 접수중 <b>›</b> ${e.kind} <b>›</b> ${e.id}.md <b>›</b> 미리보기</div>
    <div class="pv"><div class="pv__in">
      <div class="fm">
        <p class="dash"><span>---</span></p>
        <p><span class="k">주최:</span><span class="v is-s">${esc(e.organizer)}</span></p>
        <p><span class="k">${e.recruit ? '접수' : '일시'}:</span><span class="v">${e.range}</span></p>
        <p><span class="k">남은시간:</span><span class="v is-r">${e.recruit || e.state === '진행 중' ? e.remain : e.label}</span></p>
        <p><span class="k">방식:</span><span class="v is-s">${e.mode.join(', ')}</span></p>
        <p><span class="k">참가비:</span><span class="v is-s">${e.cost}</span></p>
        <p><span class="k">분류:</span><span class="v">[${[e.kind, ...e.topics].join(', ')}]</span></p>
        <p class="dash"><span>---</span></p>
      </div>
      <div class="run"><a href="${esc(e.link)}" target="_blank" rel="noopener">▶ 신청하러 가기</a><button data-toast="관심 행사에 담았어요">${ic('bookmark', 14)} 관심</button><button data-toast="캘린더에 추가했어요">${ic('calendar', 14)} 캘린더에 추가</button><button data-toast="링크가 복사되었어요">${ic('share', 14)} 링크 복사</button></div>
      <h1>${esc(e.title)}</h1>
      ${K.thumb(e)}
      <div class="k-prose">${e.descHtml}</div>
    </div></div>
  </div>
</div>${status()}`;
}
K.mount({ main, detail });
</script>
</body>
</html>
